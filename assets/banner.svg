<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#1a1533"/>
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="orb-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-18px) scale(1.08); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(16px) scale(1.05); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes drift {
        0% { transform: translateX(0px); }
        50% { transform: translateX(25px); }
        100% { transform: translateX(0px); }
      }
      @keyframes particleShimmer {
        0%, 100% { opacity: 0.2; transform: translateY(0px); }
        50% { opacity: 0.8; transform: translateY(-8px); }
      }
      .anim-orb-1 { animation: floatSlow 7s ease-in-out infinite; transform-origin: center; }
      .anim-orb-2 { animation: floatReverse 9s ease-in-out infinite; transform-origin: center; }
      .anim-pulse { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .anim-drift { animation: drift 10s ease-in-out infinite; }
      .anim-particle-1 { animation: particleShimmer 4s ease-in-out infinite; }
      .anim-particle-2 { animation: particleShimmer 5s ease-in-out 1.5s infinite; }
      .anim-particle-3 { animation: particleShimmer 3.5s ease-in-out 0.8s infinite; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="url(#bg-gradient)"/>
  <rect width="1000" height="320" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Dynamic Animated Background Orbs (Kept behind foreground) -->
  <g class="anim-drift">
    <circle cx="150" cy="80" r="140" fill="url(#orb-blue)" class="anim-orb-1"/>
    <circle cx="850" cy="110" r="160" fill="url(#orb-purple)" class="anim-orb-2"/>
    <circle cx="500" cy="270" r="130" fill="url(#orb-pink)" class="anim-pulse"/>
  </g>

  <!-- Subtle Animated Ambient Particles -->
  <g opacity="0.6">
    <circle cx="220" cy="60" r="2.5" fill="#60a5fa" class="anim-particle-1"/>
    <circle cx="340" cy="110" r="1.5" fill="#a78bfa" class="anim-particle-2"/>
    <circle cx="780" cy="70" r="2" fill="#f472b6" class="anim-particle-3"/>
    <circle cx="880" cy="220" r="3" fill="#38bdf8" class="anim-particle-1"/>
    <circle cx="120" cy="240" r="2" fill="#818cf8" class="anim-particle-2"/>
    <circle cx="670" cy="280" r="1.5" fill="#f43f5e" class="anim-particle-3"/>
  </g>

  <!-- Subtle Background Grid Overlay -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, and Pills (Crystal clear & fully readable) -->
  <g transform="translate(0, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(50, 48)">
      <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.8"/>
      <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" letter-spacing="1">🎮 CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="50" y="125" class="title-text" fill="url(#text-gradient)">
      Awesome Game Development Libraries
    </text>

    <!-- Subtitle -->
    <text x="50" y="165" class="subtitle-text">
      The definitive directory of game engines, rendering frameworks, ECS architectures, and audio toolkits.
    </text>

    <!-- Feature Pills / Chips in Foreground -->
    <g transform="translate(50, 208)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="18" y="24" class="badge-text">🕹️ 2D &amp; 3D Engines</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(175, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="18" y="24" class="badge-text">⚡ Graphics &amp; Rendering</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(370, 0)">
        <rect width="165" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="18" y="24" class="badge-text">🌐 Cross-Platform</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(550, 0)">
        <rect width="195" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="18" y="24" class="badge-text">🦀 C++ / Rust / C# / Lua</text>
      </g>

      <!-- Pill 5 -->
      <g transform="translate(760, 0)">
        <rect width="140" height="38" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.7"/>
        <text x="18" y="24" class="badge-text" fill="#34d399">🔓 100% Free/OSS</text>
      </g>
    </g>

    <!-- Bottom Status Line -->
    <text x="50" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
      Updated regularly with market valuations, pricing models, star rankings, and architectural benchmarks.
    </text>
  </g>
</svg>
