<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 320"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="50%" stop-color="#121829"/><stop offset="100%" stop-color="#1a1533"/></linearGradient><linearGradient id="text-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="badge-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".3"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".3"/></linearGradient><radialGradient id="orb-blue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="orb-purple" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".35"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient><radialGradient id="orb-pink" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".25"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient><style>@keyframes floatSlow{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.08)}}@keyframes floatReverse{0%{transform:translateY(0) scale(1)}50%{transform:translateY(16px) scale(1.05)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.15)}}@keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(25px)}}@keyframes particleShimmer{0%{opacity:.2;transform:translateY(0)}50%{opacity:.8;transform:translateY(-8px)}}.anim-orb-1{animation:floatSlow 7s ease-in-out infinite;transform-origin:center}.anim-orb-2,.anim-pulse{animation:floatReverse 9s ease-in-out infinite;transform-origin:center}.anim-pulse{animation:pulseGlow 5s ease-in-out infinite}.anim-drift{animation:drift 10s ease-in-out infinite}.anim-particle-1{animation:particleShimmer 4s ease-in-out infinite}.anim-particle-2{animation:particleShimmer 5s ease-in-out 1.5s infinite}.anim-particle-3{animation:particleShimmer 3.5s ease-in-out .8s infinite}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:16px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}</style></defs><rect width="1000" height="320" fill="url(#bg-gradient)" rx="16"/><rect width="1000" height="320" fill="none" stroke="#334155" stroke-opacity=".6" stroke-width="1.5" rx="16"/><g class="anim-drift"><circle cx="150" cy="80" r="140" fill="url(#orb-blue)" class="anim-orb-1"/><circle cx="850" cy="110" r="160" fill="url(#orb-purple)" class="anim-orb-2"/><circle cx="500" cy="270" r="130" fill="url(#orb-pink)" class="anim-pulse"/></g><g opacity=".6"><circle cx="220" cy="60" r="2.5" fill="#60a5fa" class="anim-particle-1"/><circle cx="340" cy="110" r="1.5" fill="#a78bfa" class="anim-particle-2"/><circle cx="780" cy="70" r="2" fill="#f472b6" class="anim-particle-3"/><circle cx="880" cy="220" r="3" fill="#38bdf8" class="anim-particle-1"/><circle cx="120" cy="240" r="2" fill="#818cf8" class="anim-particle-2"/><circle cx="670" cy="280" r="1.5" fill="#f43f5e" class="anim-particle-3"/></g><g stroke="#334155" stroke-opacity=".25" stroke-width=".5"><line x1="0" x2="1000" y1="80" y2="80"/><line x1="0" x2="1000" y1="160" y2="160"/><line x1="0" x2="1000" y1="240" y2="240"/><line x1="200" x2="200" y1="0" y2="320"/><line x1="400" x2="400" y1="0" y2="320"/><line x1="600" x2="600" y1="0" y2="320"/><line x1="800" x2="800" y1="0" y2="320"/></g><g><g transform="translate(0, 0) translate(50, 48)"><rect width="180" height="28" fill="#1e293b" stroke="#3b82f6" stroke-opacity=".8" stroke-width="1" rx="14"/><text x="14" y="19" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">🎮 CURATED ECOSYSTEM</text></g><text x="50" y="125" fill="url(#text-gradient)" class="title-text" transform="translate(0, 0)">Awesome Game Development Libraries</text><text x="50" y="165" class="subtitle-text" transform="translate(0, 0)">The definitive directory of game engines, rendering frameworks, ECS architectures, and audio toolkits.</text><g><g transform="translate(0, 0) translate(50, 208) translate(0, 0)"><rect width="160" height="38" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="18" y="24" class="badge-text">🕹️ 2D &amp; 3D Engines</text></g><g transform="translate(0, 0) translate(50, 208) translate(175, 0)"><rect width="180" height="38" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="18" y="24" class="badge-text">⚡ Graphics &amp; Rendering</text></g><g transform="translate(0, 0) translate(50, 208) translate(370, 0)"><rect width="165" height="38" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="18" y="24" class="badge-text">🌐 Cross-Platform</text></g><g transform="translate(0, 0) translate(50, 208) translate(550, 0)"><rect width="195" height="38" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="18" y="24" class="badge-text">🦀 C++ / Rust / C# / Lua</text></g><g transform="translate(0, 0) translate(50, 208) translate(760, 0)"><rect width="140" height="38" fill="#1e293b" stroke="#10b981" stroke-opacity=".7" stroke-width="1" rx="8"/><text x="18" y="24" fill="#34d399" class="badge-text">🔓 100% Free/OSS</text></g></g><text x="50" y="290" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" transform="translate(0, 0)">Updated regularly with market valuations, pricing models, star rankings, and architectural benchmarks.</text></g></svg>